<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1033"/>
      <stop offset="100%" stop-color="#090712"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- cables conectando nodos -->
  <g stroke="url(#cable)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M14 46 C 22 38, 26 30, 32 24"/>
    <path d="M50 44 C 42 38, 36 32, 32 24"/>
    <path d="M32 24 L 32 12"/>
    <path d="M14 46 L 10 52"/>
    <path d="M50 44 L 54 51"/>
  </g>

  <!-- nodos -->
  <circle cx="32" cy="12" r="3.4" fill="#f0abfc"/>
  <circle cx="32" cy="24" r="4" fill="#ffffff"/>
  <circle cx="14" cy="46" r="3.4" fill="#a78bfa"/>
  <circle cx="50" cy="44" r="3.4" fill="#a78bfa"/>
  <circle cx="10" cy="52" r="2.4" fill="#c4b5fd"/>
  <circle cx="54" cy="51" r="2.4" fill="#c4b5fd"/>

  <!-- estrellas -->
  <g fill="#fde68a">
    <circle cx="46" cy="14" r="1.4"/>
    <circle cx="52" cy="20" r="1"/>
    <circle cx="16" cy="18" r="1.1"/>
  </g>
</svg>
